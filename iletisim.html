<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Senin Özel CSS Dosyan -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="contact-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">WebProjem</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkında</a></li>
                    <li class="nav-item"><a class="nav-link" href="ozgecmis.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link active" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-lg-2 px-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card contact-card shadow-lg border-0">
                    <div class="card-header custom-header text-white text-center">
                        <h4 class="mb-0 fw-bold">Bize Ulaşın</h4>
                    </div>
                    <div class="card-body p-4 bg-white">
                        <form id="contactForm" action="iletisim.php" method="POST" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Adınız Soyadınız</label>
                                <input type="text" name="name" class="form-control custom-input" id="name" placeholder="Ad Soyad">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">E-posta Adresiniz</label>
                                <input type="email" name="email" class="form-control custom-input" id="email" placeholder="ornek@mail.com">
                            </div>
                            <div class="mb-3">
                                <label for="subject" class="form-label fw-semibold">Konu</label>
                                <select name="subject" class="form-select custom-input" id="subject">
                                    <option value="" selected disabled>Lütfen bir konu seçiniz...</option>
                                    <option value="Öneri">Öneri</option>
                                    <option value="Şikayet">Şikayet</option>
                                    <option value="İş Birliği">İş Birliği</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label fw-semibold">Mesajınız</label>
                                <textarea name="message" class="form-control custom-input" id="message" rows="4" placeholder="Mesajınızı buraya yazınız..."></textarea>
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm">Gönder</button>
                                <button type="reset" class="btn btn-outline-secondary btn-sm">Formu Temizle</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
