<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web Projesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card shadow-lg border-0" style="max-width: 400px; width: 100%;">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">Sistem Girişi</h4>
            </div>
            <div class="card-body p-4 bg-white">
                <form action="php/login.php" method="POST" onsubmit="return validateLogin()">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Kullanıcı Adı (Öğrenci Mail)</label>
                        <input type="text" name="email" id="loginEmail" class="form-control" placeholder="b2XXXXXXXX@sakarya.edu.tr">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Şifre (Öğrenci No)</label>
                        <input type="password" name="password" id="loginPassword" class="form-control" placeholder="Okul Numarası">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Giriş Yap</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="index.html" class="text-muted small">← Ana Sayfaya Dön</a>
                </div>
            </div>
        </div>
    </div>

    <script>
    function validateLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        // Ödev kuralı: Boş alan ve mail formatı kontrolü
        const emailRegex = /^[a-zA-Z0-9._%+-]+@sakarya\.edu\.tr$/;

        if (email === "" || password === "") {
            alert("Hata: Alanlar boş bırakılamaz!");
            return false;
        }
        if (!emailRegex.test(email)) {
            alert("Hata: Kullanıcı adı 'öğrenciNo@sakarya.edu.tr' formatında olmalıdır!");
            return false;
        }
        return true;
    }
    </script>
</body>
</html>
