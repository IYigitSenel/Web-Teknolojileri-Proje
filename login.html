<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Yiğit Şenel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Özel CSS Dosyan -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card shadow-lg border-0">
            <div class="card-header login-header text-white text-center py-4">
                <i class="fas fa-user-circle fa-3x mb-2"></i>
                <h4 class="mb-0 fw-bold">Öğrenci Girişi</h4>
            </div>
            <div class="card-body p-4 bg-white">
                <!-- Form, php klasörü altındaki login.php'ye gider -->
                <form action="php/login.php" method="POST" onsubmit="return validateForm()">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold"><i class="fas fa-envelope me-2"></i>E-posta</label>
                        <input type="text" name="email" id="email" class="form-control custom-input" placeholder="b2412100001@sakarya.edu.tr">
                        <div id="emailHelp" class="form-text text-muted small">Sakarya Üniversitesi mail adresiniz.</div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold"><i class="fas fa-lock me-2"></i>Şifre</label>
                        <input type="password" name="password" id="password" class="form-control custom-input" placeholder="Öğrenci Numaranız">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm login-btn">
                        Giriş Yap <i class="fas fa-sign-in-alt ms-2"></i>
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <a href="index.html" class="text-decoration-none text-muted small back-link">
                        <i class="fas fa-arrow-left me-1"></i> Ana Sayfaya Dön
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
    function validateForm() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const emailRegex = /^[a-zA-Z0-9._%+-]+@sakarya\.edu\.tr$/;

        if (email === "" || password === "") {
            alert("Hata: Lütfen tüm alanları doldurunuz!");
            return false;
        }

        if (!emailRegex.test(email)) {
            alert("Hata: Lütfen geçerli bir @sakarya.edu.tr mail adresi giriniz!");
            return false;
        }

        return true;
    }
    </script>
</body>
</html>
